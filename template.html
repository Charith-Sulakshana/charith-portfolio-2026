<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charith Sulakshana</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">
<script>(function(d){d.classList.add('js');if(location.hash==='#analyst')d.dataset.boot='analyst';setTimeout(function(){d.classList.add('ready')},2500)})(document.documentElement)</script>
<style>html[data-boot="analyst"] body{background:#F3F4F5}html[data-boot="analyst"] #design{display:none}</style>

<body data-mode="design">
<a class="skip" href="#design">Skip to content</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="c-path" d="M26.85,53.69v26.85h134.23v53.69H0V0h107.38c29.65,0,53.69,24.04,53.69,53.69H26.85Z"/>
    <linearGradient id="c-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B97CB"/><stop offset=".5" stop-color="#0078A8"/><stop offset="1" stop-color="#005F87"/></linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 877.19 134.23">
    <g fill="currentColor">
{{LOGO_PATHS}}
    </g>
    <use href="#c-path" fill="#0078A8"/>
  </symbol>
</svg>

<div class="wipe" aria-hidden="true"><span class="label" data-wipe-label>Business Analyst</span></div>

<nav class="nav" aria-label="Main">
  <div class="wrap nav__in">
    <a class="nav__logo" href="#top" data-top aria-label="Charith Sulakshana, back to top"><svg viewBox="0 0 877.19 134.23" aria-hidden="true"><use href="#logo"/></svg></a>
    <div class="switch" role="group" aria-label="Choose a side">
      <button type="button" class="label" data-mode="design" aria-pressed="true"><span class="lg">Creative Designer</span><span class="sm">Designer</span></button>
      <button type="button" class="label" data-mode="analyst" aria-pressed="false"><span class="lg">Business Analyst</span><span class="sm">Analyst</span></button>
      <i class="switch__bar" aria-hidden="true"></i>
    </div>
    <a class="nav__hello label" href="#d-contact" data-contact>Say hello</a>
  </div>
  <div class="progress" aria-hidden="true"><i></i></div>
</nav>

<main class="mode" id="design" data-mode="design">
{{DESIGNER}}
</main>

<main class="mode" id="analyst" data-mode="analyst" hidden>
{{ANALYST}}
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <svg viewBox="0 0 877.19 134.23" role="img" aria-label="Charith Sulakshana"><use href="#logo"/></svg>
    <p class="label">Designed and built by me, in Colombo · <span data-year>2026</span></p>
    <a class="label" href="#top" data-top>Back to top ↑</a>
  </div>
</footer>

<div class="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" class="lb__x label" data-lb-close>Close ✕</button>
  <figure class="lb__fig"><img alt="" data-lb-img><figcaption data-lb-cap></figcaption></figure>
  <button type="button" class="lb__nav lb__prev" data-lb-prev aria-label="Previous">←</button>
  <button type="button" class="lb__nav lb__next" data-lb-next aria-label="Next">→</button>
  <p class="lb__count label" data-lb-count></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/app.js"></script>
